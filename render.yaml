services:
  - type: web
    name: forex-signal-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_bot.py
    healthCheckPath: /health
    envVars:
      - key: DATA_SOURCE
        value: twelvedata
      - key: STORAGE
        value: supabase
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
